<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Aasaanly — Selected Services State</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="phone">
  <div class="status-bar"><span>10:28</span><span class="status-icons">▮▮▮ ◉ ▰</span></div>
  <header class="screen-header">
    <button class="back-button" aria-label="Go back"><img src="assets/icons/back.svg" alt=""></button>
    <div class="header-copy">
      <h1>Select Services You Offer</h1>
      <p>Choose one or more services to get relevant work requests.</p>
    </div>
  </header>

  <div class="search-wrap">
    <label class="search-box">
      <img src="assets/icons/search.svg" alt="">
      <input id="serviceSearch" type="search" placeholder="Search for services..." autocomplete="off">
      <button id="clearSearch" class="clear-search" aria-label="Clear search" hidden><img src="assets/icons/close.svg" alt=""></button>
    </label>
  </div>

  <nav class="category-tabs" aria-label="Service categories">
    <button class="category-tab active" data-category="all">All</button>
    <button class="category-tab" data-category="appliance"><img src="assets/icons/appliance.svg" alt="">Appliance Repair</button>
    <button class="category-tab" data-category="beauty"><img src="assets/icons/beauty.svg" alt="">Beauty &amp; Personal Care</button>
    <button class="category-tab" data-category="cleaning"><img src="assets/icons/cleaning.svg" alt="">Cleaning</button>
  </nav>

  <main class="service-content" id="serviceContent">
    <section class="service-section" data-section="appliance">
      <button class="section-heading" aria-expanded="true">
        <span class="section-accent"></span><img src="assets/icons/appliance.svg" alt="">
        <span>Appliance Repair</span><img class="section-chevron" src="assets/icons/chevron-up.svg" alt="">
      </button>
      <div class="service-grid">
        <button class="service-card selected" data-id="ac" data-name="AC Service &amp; Repair" data-category="appliance"><span class="selection-check"><img src="assets/icons/check.svg" alt=""></span><span class="service-icon"><img src="assets/icons/ac.svg" alt=""></span><span class="service-name">AC Service &amp;<br>Repair</span></button>
        <button class="service-card selected" data-id="chimney" data-name="Chimney / Hob" data-category="appliance"><span class="selection-check"><img src="assets/icons/check.svg" alt=""></span><span class="service-icon"><img src="assets/icons/chimney.svg" alt=""></span><span class="service-name">Chimney /<br>Hob</span></button>
        <button class="service-card" data-id="gas" data-name="Gas Stove / Hob" data-category="appliance"><span class="selection-check"><img src="assets/icons/check.svg" alt=""></span><span class="service-icon"><img src="assets/icons/flame.svg" alt=""></span><span class="service-name">Gas Stove /<br>Hob</span></button>
        <button class="service-card selected" data-id="geyser" data-name="Geyser Service" data-category="appliance"><span class="selection-check"><img src="assets/icons/check.svg" alt=""></span><span class="service-icon"><img src="assets/icons/geyser.svg" alt=""></span><span class="service-name">Geyser Service</span></button>
        <button class="service-card" data-id="inverter" data-name="Inverter / UPS" data-category="appliance"><span class="selection-check"><img src="assets/icons/check.svg" alt=""></span><span class="service-icon"><img src="assets/icons/battery.svg" alt=""></span><span class="service-name">Inverter /<br>UPS</span></button>
        <button class="service-card" data-id="microwave" data-name="Microwave / Oven" data-category="appliance"><span class="selection-check"><img src="assets/icons/microwave.svg" alt=""></span><span class="service-icon"><img src="assets/icons/microwave.svg" alt=""></span><span class="service-name">Microwave /<br>Oven</span></button>
        <button class="service-card" data-id="refrigerator" data-name="Refrigerator Service" data-category="appliance"><span class="selection-check"><img src="assets/icons/check.svg" alt=""></span><span class="service-icon"><img src="assets/icons/fridge.svg" alt=""></span><span class="service-name">Refrigerator<br>Service</span></button>
        <button class="service-card" data-id="ro" data-name="RO / Water Purifier" data-category="appliance"><span class="selection-check"><img src="assets/icons/check.svg" alt=""></span><span class="service-icon"><img src="assets/icons/water.svg" alt=""></span><span class="service-name">RO / Water<br>Purifier</span></button>
        <button class="service-card" data-id="tv" data-name="TV / Home Entertainment" data-category="appliance"><span class="selection-check"><img src="assets/icons/check.svg" alt=""></span><span class="service-icon"><img src="assets/icons/tv.svg" alt=""></span><span class="service-name">TV / Home<br>Entertainment</span></button>
      </div>
    </section>

    <section class="service-section" data-section="beauty">
      <button class="section-heading" aria-expanded="true">
        <span class="section-accent"></span><img src="assets/icons/beauty.svg" alt="">
        <span>Beauty &amp; Personal Care</span><img class="section-chevron" src="assets/icons/chevron-up.svg" alt="">
      </button>
      <div class="service-grid beauty-grid">
        <button class="service-card" data-id="makeup" data-name="Makeup Artist" data-category="beauty"><span class="selection-check"><img src="assets/icons/check.svg" alt=""></span><span class="service-icon"><img src="assets/icons/brush.svg" alt=""></span><span class="service-name">Makeup Artist</span></button>
        <button class="service-card" data-id="massage" data-name="Massage / Spa" data-category="beauty"><span class="selection-check"><img src="assets/icons/check.svg" alt=""></span><span class="service-icon"><img src="assets/icons/spa.svg" alt=""></span><span class="service-name">Massage / Spa</span></button>
        <button class="service-card" data-id="mehendi" data-name="Mehendi Artist" data-category="beauty"><span class="selection-check"><img src="assets/icons/check.svg" alt=""></span><span class="service-icon"><img src="assets/icons/flower.svg" alt=""></span><span class="service-name">Mehendi Artist</span></button>
        <button class="service-card" data-id="salon" data-name="Salon / Beautician" data-category="beauty"><span class="selection-check"><img src="assets/icons/check.svg" alt=""></span><span class="service-icon"><img src="assets/icons/scissors.svg" alt=""></span><span class="service-name">Salon /<br>Beautician</span></button>
      </div>
    </section>

    <section class="service-section cleaning-section" data-section="cleaning">
      <button class="section-heading" aria-expanded="false">
        <span class="section-accent"></span><img src="assets/icons/cleaning.svg" alt="">
        <span>Cleaning</span><img class="section-chevron" src="assets/icons/chevron-down.svg" alt="">
      </button>
      <div class="service-grid collapsed-content">
        <button class="service-card" data-id="home-cleaning" data-name="Home Cleaning" data-category="cleaning"><span class="selection-check"><img src="assets/icons/check.svg" alt=""></span><span class="service-icon"><img src="assets/icons/cleaning.svg" alt=""></span><span class="service-name">Home Cleaning</span></button>
        <button class="service-card" data-id="deep-cleaning" data-name="Deep Cleaning" data-category="cleaning"><span class="selection-check"><img src="assets/icons/check.svg" alt=""></span><span class="service-icon"><img src="assets/icons/cleaning.svg" alt=""></span><span class="service-name">Deep Cleaning</span></button>
        <button class="service-card" data-id="pest-control" data-name="Pest Control" data-category="cleaning"><span class="selection-check"><img src="assets/icons/cleaning.svg" alt=""></span><span class="service-icon"><img src="assets/icons/cleaning.svg" alt=""></span><span class="service-name">Pest Control</span></button>
      </div>
    </section>
    <div class="no-results" id="noResults" hidden>No matching services found.</div>
  </main>

  <footer class="selection-footer">
    <div class="selection-heading"><strong><span id="selectedCount">3</span> Services Selected</strong><button id="clearAll">Clear all</button></div>
    <div class="footer-bottom">
      <div class="selected-chips" id="selectedChips" aria-label="Selected services">
        <span class="selected-chip" data-chip="ac">AC Service &amp; Repair <button aria-label="Remove AC Service and Repair"><img src="assets/icons/close.svg" alt=""></button></span>
        <span class="selected-chip" data-chip="chimney">Chimney / Hob <button aria-label="Remove Chimney or Hob"><img src="assets/icons/close.svg" alt=""></button></span>
        <span class="selected-chip" data-chip="geyser">Geyser Service <button aria-label="Remove Geyser Service"><img src="assets/icons/close.svg" alt=""></button></span>
      </div>
      <button class="confirm-button" id="confirmButton"><span>Confirm</span><img src="assets/icons/arrow-right.svg" alt=""></button>
    </div>
  </footer>
</div>
<script src="app.js"></script>
</body>
</html>
