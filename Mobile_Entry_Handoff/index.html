<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff"><title>Aasaanly — Enter Mobile Number</title><link rel="stylesheet" href="styles.css">
</head>
<body><div class="app">
  <div class="status"><span>10:51</span><span class="status-right"><span class="signal"><i></i><i></i><i></i><i></i></span><span class="wifi"></span><span class="battery"></span></span></div>
  <header class="topbar">
    <button class="back" aria-label="Go back"><img src="assets/icons/arrow-left.svg" alt="" width="26" height="26"></button>
    <button class="language" id="language" aria-haspopup="true" aria-expanded="false"><img src="assets/icons/globe.svg" alt=""><span class="language-name">English</span><img src="assets/icons/chevron-down.svg" alt=""></button>
    <div class="language-menu" id="language-menu" role="menu">
      <button role="menuitem" data-language="English">English</button><button role="menuitem" data-language="हिन्दी">हिन्दी</button>
    </div>
  </header>
  <main>
    <div class="illustration-wrap"><img class="illustration" src="assets/illustrations/mobile-otp-illustration.png" alt="Phone illustration representing secure mobile sign-in"></div>
    <section class="intro"><h1>Welcome to <span>Aasaanly</span></h1><p class="subtitle">Enter your mobile number to get started</p></section>
    <form id="mobile-form" novalidate>
      <label class="field-label" for="mobile"><span class="icon-box"><img src="assets/icons/phone-call.svg" alt="" width="23" height="23"></span>Mobile Number</label>
      <div class="phone-field">
        <div class="country"><img src="assets/icons/india-flag.svg" alt="India flag"><span>+91</span></div>
        <input id="mobile" name="mobile" type="tel" inputmode="numeric" autocomplete="tel-national" maxlength="10" placeholder="Enter 10-digit mobile number" aria-describedby="helper" required>
      </div>
      <p class="helper" id="helper" aria-live="polite"></p>
      <button class="send" id="send" type="button">Send OTP <img src="assets/icons/arrow-right.svg" alt=""></button>
      <p class="terms">By continuing, you agree to our <a href="#" aria-label="Terms of Service">Terms of Service</a> and <a href="#" aria-label="Privacy Policy">Privacy Policy</a></p>
      <div class="social-proof">
        <span class="social-icon"><img src="assets/icons/users.svg" alt="" width="31" height="31"></span>
        <div class="social-copy"><strong>Join 10,000+ users</strong><span>finding work easily on Aasaanly</span></div>
      </div>
      <div class="toast" id="toast" role="status"></div>
    </form>
  </main>
</div><script src="app.js"></script></body></html>
