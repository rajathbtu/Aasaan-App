<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff"><title>Aasaanly — Choose Your Role (Service Expert Selected)</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="phone">
  <div class="status-bar"><span>10:28</span><span class="status-icons">▮▮▮ ◉ ▰</span></div>
  <header class="topbar">
    <button class="back-button" aria-label="Go back"><img src="assets/icons/back.svg" alt=""></button>
    <h1>Choose Your Role</h1>
  </header>
  <main class="content">
    <section class="intro">
      <div class="intro-copy">
        <h2>How would you like to use <span>Aasaanly?</span></h2>
        <p>Choose the role that best fits your needs.</p>
      </div>
      <img class="neighborhood" src="assets/illustrations/neighborhood.svg" alt="">
    </section>

    <section class="role-list" aria-label="Choose your role">
      <button class="role-card" data-role="consumer" aria-pressed="false">
        <span class="role-select" aria-hidden="true"><img src="assets/icons/check.svg" alt=""></span>
        <span class="role-label"><img src="assets/icons/consumer.svg" alt="">Consumer</span>
        <span class="role-title">Find Experts to<br>Get Work Done</span>
        <span class="role-description">Hire verified and skilled professionals for your home, business and everyday needs.</span>
        <span class="benefits">
          <span class="benefit"><i><img src="assets/icons/shield-check.svg" alt=""></i><span>Verified<br>Experts</span></span>
          <span class="benefit"><i><img src="assets/icons/bolt.svg" alt=""></i><span>Quick<br>Booking</span></span>
          <span class="benefit"><i><img src="assets/icons/pin.svg" alt=""></i><span>Nearby<br>Services</span></span>
        </span>
        <img class="role-art" src="assets/illustrations/consumer.svg" alt="">
      </button>

      <button class="role-card selected" data-role="expert" aria-pressed="true">
        <span class="role-select" aria-hidden="true"><img src="assets/icons/check.svg" alt=""></span>
        <span class="role-label"><img src="assets/icons/expert.svg" alt="">Service Expert</span>
        <span class="role-title">Find Work &amp; Grow<br>your Earnings</span>
        <span class="role-description">Get work requests from nearby customers and grow your service business.</span>
        <span class="benefits">
          <span class="benefit"><i><img src="assets/icons/calendar.svg" alt=""></i><span>Get<br>Work</span></span>
          <span class="benefit"><i><img src="assets/icons/coins.svg" alt=""></i><span>Increase<br>Earnings</span></span>
          <span class="benefit"><i><img src="assets/icons/award.svg" alt=""></i><span>Build<br>Your Brand</span></span>
        </span>
        <img class="role-art" src="assets/illustrations/service-expert.svg" alt="">
      </button>
    </section>
    <p class="selection-hint" id="selectionHint" aria-live="polite">You can change your role later in your profile settings.</p>
  </main>
  <footer class="footer">
    <button class="confirm-button" id="confirmButton"><span>Confirm Selection</span><img src="assets/icons/arrow-right.svg" alt=""></button>
  </footer>
</div>
<script src="app.js"></script>
</body></html>
