<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f8fcfa">
<title>Aasaanly — Splash Screen Approved Preview</title>
<style>
:root { color-scheme: light; }
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: #eef3f1; }
body { display: grid; place-items: center; font-family: Arial, sans-serif; }
.preview {
  width: min(100vw, calc(100dvh * 9 / 16));
  height: min(100dvh, calc(100vw * 16 / 9));
  aspect-ratio: 9 / 16;
  background: #fff;
  overflow: hidden;
  box-shadow: 0 8px 36px rgba(18, 48, 36, .14);
}
.preview img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  object-position: center;
}
@media (max-width: 520px) {
  body { background: #fff; }
  .preview { width: 100vw; height: auto; min-height: 100dvh; box-shadow: none; }
  .preview img { width: 100%; height: auto; }
}
</style>
</head>
<body>
<main class="preview">
  <img src="assets/splash-approved-reference.png"
       alt="Approved Aasaanly splash screen: green Aasaanly wordmark, local-help tagline, mint city and home illustration, Made in India footer and layered green waves.">
</main>
</body>
</html>
