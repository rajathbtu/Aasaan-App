<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff"><title>Aasaanly — Confirm Your Service Area</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="device">
  <div class="statusbar"><span>10:28</span><span class="sys-icons">● ◔ ▰</span></div>
  <header class="header">
    <button class="back" aria-label="Go back"><img src="assets/icons/back.svg" alt=""></button>
    <h1>Confirm Your Service Area</h1>
  </header>
  <main class="main">
    <label class="search">
      <img src="assets/icons/search.svg" alt="">
      <input id="locationSearch" type="search" placeholder="Search location (e.g. Jhansi, Civil Lines)" aria-label="Search location">
      <button id="clearSearch" class="clear" aria-label="Clear search">×</button>
    </label>

    <section class="map" aria-label="Map showing selected location and service radius">
      <img class="map-image" src="assets/map/jhansi-map-placeholder.svg" alt="Illustrative map centered on Jhansi with a 20 kilometre service radius">
      <div class="map-actions">
        <button aria-label="Center map on selected location" id="recenter"><img src="assets/icons/target.svg" alt=""></button>
        <button aria-label="Change map layers" id="layers"><img src="assets/icons/layers.svg" alt=""></button>
      </div>
      <span class="map-note">Illustrative map preview — connect the production map SDK</span>
    </section>

    <button class="current-location" id="currentLocation">
      <img src="assets/icons/target.svg" alt=""><span>Pick My Current Location</span>
    </button>

    <section class="location-card">
      <span class="icon-tile"><img src="assets/icons/pin.svg" alt=""></span>
      <div class="location-copy"><h2>Selected Location</h2><p id="selectedAddress">Jhansi, Uttar Pradesh</p></div>
      <button class="change-location" id="changeLocation"><img src="assets/icons/edit.svg" alt="">Change</button>
    </section>

    <section class="radius-card">
      <div class="radius-heading">
        <span class="icon-tile"><img src="assets/icons/radius.svg" alt=""></span>
        <div><h2>Service Radius</h2><p>You’ll see work requests within this range.</p></div>
      </div>
      <div class="radius-options" role="group" aria-label="Choose service radius">
        <button data-radius="5">5 km</button><button data-radius="10">10 km</button><button data-radius="15">15 km</button><button data-radius="20" class="active" aria-pressed="true">20 km</button>
      </div>
    </section>
  </main>
  <footer class="footer"><button class="confirm" id="confirm"><span>Confirm Service Area</span><img src="assets/icons/arrow-right.svg" alt=""></button></footer>
</div>
<script src="app.js"></script>
</body></html>
