<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#F7FAFC">
<title>Aasaanly — Boost Request</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="viewport"><main class="screen" id="screen">
  <img class="statusbar" src="assets/status_bar_reference.png" alt="">
  <header class="header">
    <button class="back" aria-label="Go back"><img src="assets/back.svg" alt=""></button>
    <h1>Boost Request</h1>
  </header>

  <section class="request-card">
    <img class="service-art" src="assets/service_ac_thumbnail.png" alt="AC service illustration">
    <div class="vertical-rule"></div>
    <div class="request-copy">
      <h2>AC Service &amp; Repair</h2>
      <p>AC Service &amp; Repair</p>
      <div class="time"><img src="assets/clock.svg" alt="">Requested just now</div>
      <div class="address"><img src="assets/location.svg" alt=""><strong>Jhansi, Uttar Pradesh</strong></div>
    </div>
  </section>

  <section class="hero">
    <div class="hero-copy">
      <h2>Get More Responses</h2>
      <strong>Faster!</strong>
      <p>Boost your request to reach more<br>verified service experts quickly.</p>
    </div>
    <img src="assets/boost_rocket_illustration.png" alt="Rocket illustration">
  </section>

  <section class="benefits">
    <h2>What You’ll Get with Boost</h2>
    <div class="benefit-row">
      <div class="benefit"><span class="benefit-icon"><img src="assets/bolt.svg"></span><b>Higher<br>Visibility</b></div>
      <i class="benefit-divider"></i>
      <div class="benefit"><span class="benefit-icon"><img src="assets/trophy.svg"></span><b>Top<br>Placement</b></div>
      <i class="benefit-divider"></i>
      <div class="benefit"><span class="benefit-icon"><img src="assets/badge.svg"></span><b>Urgent<br>Badge</b></div>
    </div>
  </section>

  <section class="payment">
    <h2>Choose a Payment Option</h2>
    <button class="payment-option selected" data-option="money" aria-pressed="true">
      <span class="radio"><i></i></span>
      <span class="payment-icon"><img src="assets/wallet.svg"></span>
      <span class="payment-copy"><b>Pay with Money</b><small>One-time boost for this work request</small></span>
      <strong class="amount">₹100</strong>
    </button>
    <button class="payment-option disabled" data-option="points" aria-pressed="false">
      <span class="radio"><i></i></span>
      <span class="payment-icon"><img src="assets/coins.svg"></span>
      <span class="payment-copy"><b>Use Credit Points</b><small>Your balance: 0 points</small><em>Need 100 more points</em></span>
      <strong class="points">100 pts</strong>
    </button>
  </section>

  <button class="pay-button" id="pay"><img src="assets/zap.svg" alt=""><span>Pay ₹100 &amp; Boost Now</span></button>
</main></div>
<script src="app.js"></script>
</body></html>
